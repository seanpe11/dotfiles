---
# Arch on WSL2 ships with systemd OFF. Without it there is no `systemctl --user`,
# so tmux-services and the syncthing unit cannot exist. This role must run first.
- name: Configure /etc/wsl.conf
  ansible.builtin.copy:
    dest: /etc/wsl.conf
    mode: "0644"
    content: |
      # Managed by dotfiles/ansible.
      [boot]
      systemd=true

      [interop]
      # false makes command lookup faster (no giant Windows PATH) but breaks
      # explorer.exe / clip.exe / code . — keep true unless you want that trade.
      appendWindowsPath={{ wsl_append_windows_path | lower }}

      [automount]
      enabled=true
      options="metadata,umask=22,fmask=11"
  register: wslconf

- name: Tell the operator a shutdown is required
  ansible.builtin.debug:
    msg: >-
      /etc/wsl.conf changed. Run `wsl --shutdown` from PowerShell and reopen the
      distro, then re-run this playbook. systemd is not active until you do.
  when: wslconf is changed

- name: Windows sleep leaves the WSL clock skewed, which breaks TLS and git
  ansible.builtin.systemd_service:
    name: systemd-timesyncd
    enabled: true
    state: started
  when: ansible_service_mgr == 'systemd'

- name: Keep user units alive after the terminal closes
  ansible.builtin.command: "loginctl enable-linger {{ target_user }}"
  changed_when: false
