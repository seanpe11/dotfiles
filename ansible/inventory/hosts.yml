all:
  children:
    # Machines Sean develops ON. Server/host-layer provisioning lives in
    # pemily-homelab — do not duplicate it here.
    workstations:
      hosts:
        pegasus-wsl:
          # Arch on WSL2 inside Windows on pegasus (Ryzen 9700X / RTX 5070).
          # Run the playbook FROM pegasus against itself: ssh in from rocinante
          # is the latency this repo exists to eliminate.
          ansible_connection: local
          is_wsl: true
          os_family_pkg: pacman

        rocinante:
          # Fedora 39 laptop, treated as an always-on server. Reached by tailnet
          # MagicDNS; it also runs the load-bearing `services` tmux session.
          ansible_host: rocinante
          ansible_user: seanpe
          is_wsl: false
          os_family_pkg: dnf
