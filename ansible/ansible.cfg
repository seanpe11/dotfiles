# Same conventions as pemily-homelab/ansible/ansible.cfg — that one is proven
# against ansible-core 2.21. Scope differs: that repo provisions servers, this
# one provisions the machines Sean types on.
[defaults]
inventory = inventory/hosts.yml
roles_path = roles
stdout_callback = default
result_format = yaml
retry_files_enabled = False
host_key_checking = False
interpreter_python = /usr/bin/python3

[ssh_connection]
pipelining = True
