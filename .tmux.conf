# remap prefix from 'C-b' to 'C-a'
unbind C-b

## Toggle Term
unbind t

## Toggle Term
bind-key t if-shell '[ "$(tmux display-message -p "#{session_name}")" = "popup" ]' {
    detach-client
} {
    display-popup -E -w 90% -h 90% "tmux new-session -A -s popup"
}

set-option -g prefix C-a
bind-key C-a send-prefix

set -sg escape-time 0
set -gq allow-passthrough on
set-option -g mouse on

bind-key -r f run-shell "tmux neww ~/bin/.local/fmux"
bind-key -r o run-shell "tmux neww ~/bin/.local/fmux"
bind-key -r v if-shell "tmux has-session -t PepeVault 2>/dev/null" \
   "switch-client -t PepeVault" \
   "new-session -s PepeVault -c ~/Documents/PepeVault/ 'nvim .'"

# # List of plugins
set -g @tpm_plugins '          \
 tmux-plugins/tpm             \
 tmux-plugins/tmux-sensible   \
 tmux-plugins/tmux-resurrect  \
 tmux-plugins/tmux-continuum  \
 erikw/tmux-powerline \
'
# for neovim
set -g @resurrect-strategy-nvim 'session'

# --- session snapshots (added 2026-09-23) ---
# resurrect was installed but only saved when you remembered the keybind; the
# last snapshot was 47 days old. continuum saves automatically.
set -g @continuum-save-interval '15'      # minutes
# Deliberately NOT setting @continuum-restore or @continuum-boot: the `services`
# session is owned by the systemd unit tmux-services.service. Auto-restore would
# race it and you'd get two cloudflared processes and a port clash on ttyd 7681.
# After a reboot: systemd brings back `services`, you press prefix + Ctrl-r for
# the rest.
set -g @resurrect-capture-pane-contents 'on'   # keep scrollback
# Processes resurrect is allowed to relaunch. Default list covers nvim/less/etc;
# these are the ones that matter here. '~' means "match loosely".
set -g @resurrect-processes '"~bpytop" "~btop" "~claude"'
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
